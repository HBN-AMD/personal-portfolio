<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="100%" stop-color="#121628"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <circle cx="400" cy="240" r="220" fill="url(#aiGlow)"/>

  <!-- AI Neural Visualizer -->
  <g transform="translate(150, 80)">
    <rect width="500" height="340" rx="12" fill="#0e1320" stroke="#1f283d" stroke-width="1.5"/>
    <text x="35" y="45" fill="#10b981" font-family="monospace" font-size="14" font-weight="600">AI Study Assistant // NLP Pipeline</text>
    
    <!-- Connected Neural Nodes -->
    <g stroke="#26354f" stroke-width="1.5">
      <line x1="100" y1="120" x2="250" y2="100"/>
      <line x1="100" y1="120" x2="250" y2="180"/>
      <line x1="100" y1="200" x2="250" y2="100"/>
      <line x1="100" y1="200" x2="250" y2="180"/>
      <line x1="100" y1="200" x2="250" y2="260"/>
      <line x1="100" y1="280" x2="250" y2="180"/>
      <line x1="100" y1="280" x2="250" y2="260"/>

      <line x1="250" y1="100" x2="400" y2="150"/>
      <line x1="250" y1="180" x2="400" y2="150"/>
      <line x1="250" y1="180" x2="400" y2="230"/>
      <line x1="250" y1="260" x2="400" y2="230"/>
    </g>

    <!-- Node circles -->
    <circle cx="100" cy="120" r="10" fill="#00f0ff"/>
    <circle cx="100" cy="200" r="10" fill="#00f0ff"/>
    <circle cx="100" cy="280" r="10" fill="#00f0ff"/>

    <circle cx="250" cy="100" r="12" fill="#10b981"/>
    <circle cx="250" cy="180" r="14" fill="#38bdf8"/>
    <circle cx="250" cy="260" r="12" fill="#10b981"/>

    <circle cx="400" cy="150" r="15" fill="#00f0ff"/>
    <circle cx="400" cy="230" r="15" fill="#10b981"/>
  </g>
</svg>
