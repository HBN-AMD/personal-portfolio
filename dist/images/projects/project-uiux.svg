<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Figma-like UI Board -->
  <g transform="translate(130, 70)">
    <rect width="540" height="360" rx="14" fill="#0f1424" stroke="#232d47" stroke-width="1.5"/>
    <!-- UI components on artboard -->
    <rect x="30" y="30" width="140" height="42" rx="8" fill="url(#purpleGrad)" opacity="0.9"/>
    <text x="55" y="56" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Button Primary</text>

    <rect x="190" y="30" width="140" height="42" rx="8" fill="#182038" stroke="#334168" stroke-width="1.5"/>
    <text x="210" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="13">Button Outline</text>

    <!-- Color Palette Tokens -->
    <rect x="30" y="100" width="480" height="80" rx="10" fill="#13192d" stroke="#222c47" stroke-width="1"/>
    <circle cx="70" cy="140" r="22" fill="#00f0ff"/>
    <circle cx="140" cy="140" r="22" fill="#10b981"/>
    <circle cx="210" cy="140" r="22" fill="#6366f1"/>
    <circle cx="280" cy="140" r="22" fill="#8b5cf6"/>
    <circle cx="350" cy="140" r="22" fill="#ec4899"/>
    <circle cx="420" cy="140" r="22" fill="#f59e0b"/>

    <!-- Cards Prototype -->
    <rect x="30" y="205" width="225" height="125" rx="10" fill="#171e35" stroke="#263354" stroke-width="1"/>
    <rect x="50" y="225" width="36" height="36" rx="8" fill="#00f0ff" opacity="0.2"/>
    <rect x="95" y="235" width="120" height="12" rx="3" fill="#e2e8f0" opacity="0.8"/>
    <rect x="50" y="280" width="180" height="10" rx="3" fill="#64748b" opacity="0.5"/>

    <rect x="285" y="205" width="225" height="125" rx="10" fill="#171e35" stroke="#263354" stroke-width="1"/>
    <rect x="305" y="225" width="36" height="36" rx="8" fill="#8b5cf6" opacity="0.2"/>
    <rect x="350" y="235" width="120" height="12" rx="3" fill="#e2e8f0" opacity="0.8"/>
    <rect x="305" y="280" width="180" height="10" rx="3" fill="#64748b" opacity="0.5"/>
  </g>
</svg>
