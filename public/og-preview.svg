<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#0e121e"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>
  <circle cx="600" cy="315" r="400" fill="url(#ogGlow)"/>

  <!-- Center Content -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- 6 Pixels Logo Mark -->
    <g transform="translate(-54, -130)">
      <rect x="0" y="0" width="30" height="30" rx="4" fill="#00f0ff"/>
      <rect x="40" y="0" width="30" height="30" rx="4" fill="#00f0ff"/>
      <rect x="80" y="0" width="30" height="30" rx="4" fill="#00f0ff"/>
      <rect x="0" y="40" width="30" height="30" rx="4" fill="#10b981"/>
      <rect x="40" y="40" width="30" height="30" rx="4" fill="#00f0ff"/>
      <rect x="80" y="40" width="30" height="30" rx="4" fill="#10b981"/>
    </g>

    <text y="-10" fill="#94a3b8" font-family="monospace" font-size="20" letter-spacing="8">SOFTWARE HOUSE &amp; DIGITAL AGENCY</text>
    <text y="60" fill="#ffffff" font-family="sans-serif" font-size="72" font-weight="900" letter-spacing="2">SIX PIXELS</text>
    <text y="120" fill="#38bdf8" font-family="sans-serif" font-size="30" font-weight="600">Six Minds. One Pixel-Perfect Solution.</text>
    <text y="180" fill="#64748b" font-family="monospace" font-size="18">Websites · Software Tools · UI/UX · AI Prototypes</text>
  </g>
</svg>
