<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#14192b"/>
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="gridPattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" fill="url(#gridPattern1)"/>
  
  <!-- Subtle glowing circle -->
  <circle cx="400" cy="250" r="180" fill="#00F0FF" opacity="0.06" filter="blur(40px)"/>

  <!-- Window Frame -->
  <g transform="translate(140, 80)">
    <rect width="520" height="340" rx="12" fill="#121626" stroke="#252d47" stroke-width="1.5"/>
    <rect width="520" height="36" rx="12" fill="#1a2035"/>
    <path d="M 0 36 L 520 36" stroke="#252d47" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="18" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="10" width="180" height="16" rx="4" fill="#0c101c" opacity="0.6"/>

    <!-- Content Mockup -->
    <rect x="30" y="60" width="140" height="18" rx="4" fill="url(#cyanGrad1)" opacity="0.9"/>
    <rect x="30" y="90" width="220" height="10" rx="3" fill="#475569" opacity="0.4"/>
    <rect x="30" y="110" width="180" height="10" rx="3" fill="#475569" opacity="0.3"/>

    <!-- Grid Cards -->
    <rect x="30" y="145" width="140" height="150" rx="8" fill="#171d33" stroke="#252d47" stroke-width="1"/>
    <rect x="45" y="165" width="40" height="40" rx="6" fill="#00F0FF" opacity="0.2"/>
    <rect x="45" y="220" width="80" height="10" rx="3" fill="#cbd5e1" opacity="0.8"/>
    <rect x="45" y="240" width="110" height="8" rx="2" fill="#64748b" opacity="0.6"/>

    <rect x="190" y="145" width="140" height="150" rx="8" fill="#171d33" stroke="#252d47" stroke-width="1"/>
    <rect x="205" y="165" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.2"/>
    <rect x="205" y="220" width="80" height="10" rx="3" fill="#cbd5e1" opacity="0.8"/>
    <rect x="205" y="240" width="110" height="8" rx="2" fill="#64748b" opacity="0.6"/>

    <rect x="350" y="145" width="140" height="150" rx="8" fill="#171d33" stroke="#252d47" stroke-width="1"/>
    <rect x="365" y="165" width="40" height="40" rx="6" fill="#10b981" opacity="0.2"/>
    <rect x="365" y="220" width="80" height="10" rx="3" fill="#cbd5e1" opacity="0.8"/>
    <rect x="365" y="240" width="110" height="8" rx="2" fill="#64748b" opacity="0.6"/>
  </g>

  <!-- Pixel accent marks -->
  <rect x="110" y="55" width="10" height="10" fill="#00F0FF" opacity="0.8"/>
  <rect x="680" y="390" width="12" height="12" fill="#10B981" opacity="0.8"/>
</svg>
